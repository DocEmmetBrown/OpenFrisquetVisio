; Configuration LilyGo suivie dans Git ; les réglages communs viennent de
; votre platformio.ini local (ignoré par Git).
; pio run --project-conf platformio.lilygo.ini -e ttgo_lora32_v21
[platformio]
extra_configs = platformio.ini
default_envs = ttgo_lora32_v21

[env:ttgo_lora32_v21]
board = ttgo-lora32-v21
board_build.partitions = min_spiffs.csv
build_flags = -DBOARD_TTGO_LORA32
upload_protocol = esptool
upload_port =
upload_flags =
upload_speed = 115200
lib_deps =
    jgromes/RadioLib@7.8.1
    knolleary/PubSubClient@2.8
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@4.0.6
    paulstoffregen/Time@1.6.1
    bblanchon/ArduinoJson@7.4.3
