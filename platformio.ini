; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; For first installation, remove below line
; - upload_protocol = espota
; and replace IP adress with COM3
; - upload_port = 192.168.1.185


[platformio]
default_envs = heltec_wifi_lora_32_V3

[env:heltec_wifi_lora_32_V3]
board = heltec_wifi_lora_32_V3
#upload_port = /dev/cu.usbserial-0001
#monitor_port = /dev/cu.usbserial-0001
upload_protocol = espota
upload_port = 192.168.1.184
upload_flags = "--host_port=3232"

; V4: native USB (no USB-UART bridge), 16MB flash. Upload via USB by default.
[env:heltec_wifi_lora_32_V4]
board = heltec_wifi_lora_32_V4
board_build.variants_dir = variants
board_build.variant = heltec_V4
; 80 MHz is enough for Wi-Fi + radio and saves power on battery
board_build.f_cpu = 80000000L
; Avoid resetting the board when opening the serial monitor
monitor_dtr = 1
monitor_rts = 1

; V4 OTA upload (once the firmware has been installed via USB)
[env:heltec_wifi_lora_32_V4-OTA]
extends = env:heltec_wifi_lora_32_V4
upload_protocol = espota
upload_port = 192.168.1.184
upload_flags = "--host_port=3232"

[env]
platform = espressif32 @ 7.0.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps = 
	jgromes/RadioLib@^6.6.0
	knolleary/PubSubClient@^2.8
	heltecautomation/Heltec ESP32 Dev-Boards@^1.1.2
  	paulstoffregen/OneWire@^2.3.8
  	milesburton/DallasTemperature@^3.11.0
  	paulstoffregen/Time@^1.6.1
	bblanchon/ArduinoJson

#extra_scripts = pre:tools/version.py

